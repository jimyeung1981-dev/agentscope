# Nginx Gateway configuration for decoupled AgentScope Managed Agent cluster

events {
    worker_connections 2048;
}

http {
    upstream managed_agent_cluster {
        # Consistent hashing by session_id to maintain sticky affinity
        hash $http_x_session_id consistent;

        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        keepalive 64;
    }

    server {
        listen 80;
        server_name api.agentscope.local;

        # Global Timeouts for long AI Agent reasoning loops
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering globally for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        location / {
            proxy_pass http://managed_agent_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward multi-tenant identity headers
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
